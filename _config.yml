title: VedicEnglish.com
description: >-
  Free English word-power lessons for school children: musical word making,
  collocations, spoken English, and Odia poetry.
lang: en
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://vedicenglish.com" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

disable_disk_cache: true

images: assets/images
files: assets/files
just_the_docs:
  collections:
    posts:
      # Lessons are reached from the home page, not from a 70-item sidebar. They stay searchable.
      nav_exclude: true

permalink: /posts/:title.html

defaults:
  # Image shown when a page is shared (WhatsApp, Facebook, ...).
  - scope: { path: "" }
    values: { image: /assets/images/social-card.png }
  # Odia-language lessons, matched by file name.
  - scope: { path: "_posts/*Shabda-Ganga*" }
    values: { lang: or }
  - scope: { path: "_posts/*Pratisabda-Geeti-Ganga*" }
    values: { lang: or }
  - scope: { path: "_posts/*Sabda-Sambhara*" }
    values: { lang: or }
  - scope: { path: "_posts/*Smruti-*abita*" }
    values: { lang: or }
  - scope: { path: "_posts/*odia-kabita*" }
    values: { lang: or }
  - scope: { path: "_posts/*Jagannath-Janana*" }
    values: { lang: or }

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
# logo: "/assets/images/just-the-docs.png"

# Enable or disable the site search
# Supports true (default) or false
search_enabled: true

search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 2
  # Maximum amount of previews per search result
  # Default: 3
  previews: 3
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 5
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 10
  # Set the search token separator
  # Default: /[\s\-/]+/
  # Example: enable support for hyphenated search words
  tokenizer_separator: /[\s/]+/
  # Display the relative url in search results
  # Supports true (default) or false
  rel_url: true
  # Enable or disable the search button that appears in the bottom right corner of every page
  # Supports true or false (default)
  button: false

# Heading anchor links appear on hover over h1-h6 tags in page content
# allowing users to deep link to a particular heading on a page.
#
# Supports true (default) or false
heading_anchors: true

# Repo-only files that must not be published. Setting this list replaces Jekyll 3's
# defaults, so those are listed too. Keep the vendor entries
# specific: a bare `vendor/` also drops the theme's own `_layouts/vendor/compress.html`. Markdown files are rendered into pages
# even without front matter, so anything not meant for visitors must be listed here.
exclude:
  - README.md
  - CLAUDE.md
  - docs/
  - scripts/
  - screenshots/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - node_modules/
